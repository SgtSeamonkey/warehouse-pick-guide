<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Door Line LH Side Kitting Pick Guide</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --or:#FF6A13;--ord:#7A3305;--orbg:#2a1608;
  --yw:#F5C800;--ywh:#FFE840;
  --bg:#0b1119;--panel:#111a26;--line:#22334a;--tx:#e8edf3;--mut:#7f93ab;--gn:#00e676;
}
html,body{width:100%;height:100%;background:var(--bg);color:var(--tx);
  font-family:'Segoe UI',Arial,sans-serif;overflow:hidden}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}

/* ---- Header ---- */
#hd{background:#060b12;border-bottom:3px solid var(--yw);
  display:flex;align-items:center;gap:24px;padding:10px 20px}
#hd h1{font-size:clamp(1.1rem,1.9vw,1.9rem);font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;color:#fff;white-space:nowrap;display:flex;align-items:center;gap:12px}
#hd h1 .side{background:var(--yw);color:#111;padding:2px 12px;border-radius:6px}
#flow{flex:1;text-align:center;font-size:clamp(.95rem,1.45vw,1.5rem);font-weight:700;
  color:var(--mut);white-space:nowrap;letter-spacing:.03em}
#flow .y{color:#111;background:var(--yw);padding:1px 10px;border-radius:5px}
#flow .o{color:#fff;background:var(--or);padding:1px 10px;border-radius:5px}
#flow .arr{color:#fff;margin:0 10px}
#hr{display:flex;align-items:center;gap:8px;font-size:.75rem;white-space:nowrap}
#sd{width:12px;height:12px;border-radius:50%;background:var(--gn);
  box-shadow:0 0 8px 2px rgba(0,230,118,.6)}
#lu{color:var(--mut);font-size:.8rem;min-width:84px}
.hb{background:transparent;border:1px solid #2a3a55;color:#8ea2bb;
  padding:4px 9px;border-radius:4px;font-size:.7rem;cursor:pointer;opacity:.75}
.hb:hover{opacity:1;border-color:var(--yw);color:var(--yw)}

/* ---- Main layout ---- */
#main{display:grid;grid-template-columns:clamp(340px,31vw,620px) 1fr;gap:16px;
  padding:14px 16px;min-height:0}
.ph{font-size:clamp(.8rem,1vw,1.05rem);font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.ph::before{content:'';width:14px;height:14px;border-radius:3px;background:currentColor}
.ph.o{color:var(--or)}.ph.y{color:var(--yw)}

/* ---- Orange cart (mirrors the real 4 x 2 pass-thru cart) ---- */
#cart{display:flex;flex-direction:column;min-height:0}
#cart-frame{flex:1;min-height:0;border:10px solid var(--or);border-radius:8px;
  background:#1b1d21;padding:8px;display:grid;
  grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:8px;
  box-shadow:0 0 0 2px #000 inset}
#cart-wheels{display:flex;justify-content:space-between;padding:0 18px}
#cart-wheels span{width:30px;height:30px;margin-top:-4px;border-radius:50%;
  background:#c94f10;border:4px solid #2a2a2a}
.slot{background:#3a3d42;border:2px solid #555a61;border-radius:6px;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:10px 6px;gap:8px;min-width:0;overflow:hidden}
.slot.on{background:#2b2f35;border-color:var(--or);box-shadow:0 0 0 2px var(--or) inset}
.slot.empty{opacity:.4}
.slot .sn{width:clamp(44px,3.6vw,68px);height:clamp(44px,3.6vw,68px);border-radius:50%;
  background:var(--or);color:#fff;font-weight:900;border:3px solid #111;
  font-size:clamp(1.6rem,2.4vw,2.7rem);display:flex;align-items:center;justify-content:center;flex:none}
.slot .dt{font-size:clamp(1rem,1.35vw,1.6rem);font-weight:900;color:#fff;line-height:1.1;
  text-transform:uppercase;word-break:break-word}
.slot .dc{font-size:clamp(.72rem,.9vw,1.05rem);font-weight:600;color:#ffcfae;line-height:1.2;
  word-break:break-word;font-family:Consolas,'Courier New',monospace}
.slot .pf{margin-top:auto;width:100%}
.slot .pf .lbl{font-size:clamp(.55rem,.62vw,.75rem);letter-spacing:.12em;color:#b9c0c9;font-weight:700}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:4px}
.chip{background:var(--yw);color:#111;font-weight:900;border-radius:5px;
  font-size:clamp(1rem,1.4vw,1.7rem);min-width:2em;padding:1px 6px}

/* ---- Yellow rack ---- */
#pr{display:flex;flex-direction:column;min-height:0;min-width:0}
#rsv{width:100%;height:auto;max-height:58vh;display:block;flex:none}
.RF{fill:none;stroke:var(--yw);stroke-width:4;stroke-linejoin:round;opacity:.55}
.RS{fill:#101a26;stroke:#2a3d56;stroke-width:1.5}
.RS.on{fill:var(--yw);stroke:#fff6b0;stroke-width:3;
  filter:drop-shadow(0 0 10px rgba(245,200,0,.55));animation:rg 1.6s ease-in-out infinite}
@keyframes rg{0%,100%{stroke-opacity:1}50%{stroke-opacity:.35}}
.SN{font-family:'Segoe UI',Arial,sans-serif;fill:#5b7593;font-weight:900;
  text-anchor:start;dominant-baseline:auto;pointer-events:none}
.SN.on{fill:#2b2100}
.SP{font-family:Consolas,'Courier New',monospace;fill:#4f6a88;font-weight:600;
  text-anchor:middle;dominant-baseline:central;pointer-events:none}
.SP.on{fill:#2b2100;font-weight:700}
.SD{font-family:'Segoe UI',Arial,sans-serif;fill:#6d88a6;font-weight:700;
  text-anchor:middle;dominant-baseline:central;pointer-events:none}
.SD.on{fill:#000;font-weight:900}

/* ---- Pick list ---- */
#pl-wrap{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:12px}
#picklist{flex:1;min-height:0;overflow:auto;display:grid;align-content:start;gap:6px;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr))}
.pl{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;
  background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--yw);
  border-radius:6px;padding:6px 10px}
.pl .sec{background:var(--yw);color:#111;font-weight:900;border-radius:6px;
  font-size:clamp(1.05rem,1.35vw,1.6rem);min-width:2.2em;text-align:center;padding:2px 6px}
.pl .pt{min-width:0}
.pl .pt b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:clamp(.9rem,1.1vw,1.3rem);color:#fff;line-height:1.15}
.pl .pt span{display:block;font-size:clamp(.7rem,.8vw,.95rem);color:var(--mut);
  font-family:Consolas,'Courier New',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .to{display:flex;align-items:center;gap:5px}
.pl .to .ar{color:var(--mut);font-size:1.2rem;margin-right:2px}
.dot{width:clamp(28px,2.2vw,40px);height:clamp(28px,2.2vw,40px);border-radius:50%;
  background:var(--or);color:#fff;border:2px solid #111;font-weight:900;
  font-size:clamp(.95rem,1.2vw,1.4rem);display:flex;align-items:center;justify-content:center}
.pl-empty{color:var(--mut);font-size:1.2rem;padding:20px}

/* Smaller screens: keep every "pick from" number visible in narrow cart slots */
@media (max-width:1500px){
  .slot{padding:8px 3px;gap:6px}
  .chips{gap:3px}
  .chip{font-size:.85rem;min-width:1.8em;padding:0 3px}
  .slot .dc{font-size:.68rem}
}
/* ---- Footer ---- */
#ft{background:#060b12;border-top:2px solid #1a2840;display:flex;align-items:center;
  justify-content:space-between;padding:8px 20px;gap:12px}
#fl{display:flex;gap:22px;font-size:clamp(.75rem,.9vw,1rem);color:var(--mut);white-space:nowrap}
#fl i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px}
#fm{flex:1;text-align:center;font-size:clamp(.8rem,1vw,1.1rem);font-weight:700;color:var(--yw)}
#fx{color:var(--mut);font-size:clamp(.75rem,.9vw,1rem);white-space:nowrap;text-align:right}

/* ---- Edit modal ---- */
#edit-modal{position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:1000}
#edit-modal .modal-body{background:#1a2540;border:2px solid var(--yw);border-radius:8px;
  padding:20px;min-width:340px;max-width:90vw;color:var(--tx)}
#edit-modal h2{margin:0 0 12px;font-size:1rem;color:var(--yw)}
#edit-modal label{display:block;margin:8px 0 2px;font-size:.75rem;color:#8899aa}
#edit-modal input[type="text"],
#edit-modal input[type="number"]{width:100%;padding:6px 8px;border:1px solid #2a3a55;
  border-radius:4px;background:#0d151f;color:var(--tx);font-size:.85rem}
#edit-modal input[type="file"]{margin:4px 0;font-size:.75rem;color:var(--tx)}
#edit-modal .img-preview{max-width:100%;max-height:120px;margin:6px 0;border:1px solid #2a3a55;border-radius:4px}
#edit-modal .btn-row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
#edit-modal .btn{padding:6px 16px;border:none;border-radius:4px;font-size:.8rem;cursor:pointer}
#edit-modal .btn-save{background:var(--yw);color:#1a2540;font-weight:700}
#edit-modal .btn-cancel{background:#2a3a55;color:var(--tx)}
#edit-modal .btn-remove{background:#6a2020;color:#fff;font-size:.7rem}
#edit-modal .btn-reset{background:#6a4020;color:#fff;font-size:.7rem}
.dim-row{display:flex;gap:8px}
.dim-row>div{flex:1}
/* Slot picker modal */
#slot-picker{position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:1000}
#slot-picker .modal-body{background:#1a2540;border:2px solid var(--yw);border-radius:8px;
  padding:20px;min-width:340px;max-width:90vw;max-height:80vh;color:var(--tx);overflow-y:auto}
#slot-picker h2{margin:0 0 12px;font-size:1rem;color:var(--yw)}
#slot-picker .slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:6px}
#slot-picker .slot-btn{padding:8px 4px;border:1px solid #2a3a55;border-radius:4px;
  background:#0d151f;color:var(--tx);font-size:.8rem;cursor:pointer;text-align:center}
#slot-picker .slot-btn:hover{background:#203050;border-color:var(--yw)}
#slot-picker .slot-btn.zero{border-color:#6a2020;color:#ff6666}
#slot-picker .sp-close{margin-top:12px;padding:6px 16px;border:none;border-radius:4px;
  font-size:.8rem;cursor:pointer;background:#2a3a55;color:var(--tx)}
</style>
</head>
<body>
<div id="app">
<header id="hd">
  <h1><span class="side">LH</span> Door Line Kitting</h1>
  <div id="flow">PICK from <span class="y">YELLOW</span> rack<span class="arr">&#10132;</span>PUT in <span class="o">ORANGE</span> cart slot</div>
  <div id="hr">
    <button class="hb" id="btn-slots">&#9998; Edit Slots</button>
    <button class="hb" id="btn-export">&#8681; Export</button>
    <button class="hb" id="btn-import">&#8679; Import</button>
    <input type="file" id="import-file" accept=".json" style="display:none">
    <div id="sd" title="Green = up to date, red = could not read the file"></div>
    <span id="lu">&#8212;</span>
  </div>
</header>
<div id="main">
  <aside id="cart">
    <div class="ph o">Orange pass-thru cart</div>
    <div id="cart-frame"></div>
    <div id="cart-wheels"><span></span><span></span></div>
  </aside>
  <section id="pr">
    <div class="ph y">Yellow rack</div>

    <rect class="RF" x="340"  y="151" width="112" height="364" rx="4"/><!-- F (slots 9-12) -->
    <rect class="RF" x="452"  y="179" width="140" height="336" rx="4"/><!-- D (slots 13-20) -->

    <!-- Cells generated by JS -->
    <g id="rack-cells"></g>
    <g id="badge-layer"></g>
    </svg>
    <div id="pl-wrap">
      <div class="ph y">Pick list</div>
      <div id="picklist"></div>
    </div>
  </section>
</div>
<footer id="ft">
  <span id="fl"><span><i style="background:var(--yw)"></i>Pick from this rack section</span><span><i style="background:var(--or);border-radius:50%"></i>Put in this cart slot</span></span>
  <span id="fm">Loading&#8230;</span>
  <span id="fx"></span>
</footer>
<div id="edit-modal" style="display:none">
  <div class="modal-body">
    <h2>Edit Rack Slot <span id="em-slot"></span></h2>
    <label for="em-part">Part Number</label>
    <input type="text" id="em-part" maxlength="30">
    <label for="em-desc">Description</label>
    <input type="text" id="em-desc" maxlength="30">
    <div class="dim-row">
      <div><label for="em-w">Width (px)</label><input type="number" id="em-w" min="0"></div>
      <div><label for="em-h">Height (px)</label><input type="number" id="em-h" min="0"></div>
    </div>
    <label for="em-img">Image</label>
    <input type="file" id="em-img" accept="image/*">
    <img id="em-preview" class="img-preview" alt="Preview" style="display:none">
    <div class="btn-row">
      <button class="btn btn-reset" id="em-reset">Reset to Default</button>
      <button class="btn btn-remove" id="em-rm-img" style="display:none">Remove Image</button>
      <button class="btn btn-cancel" id="em-cancel">Cancel</button>
      <button class="btn btn-save" id="em-save">Save</button>
    </div>
  </div>
</div>
<div id="slot-picker" style="display:none">
  <div class="modal-body">
    <h2>Select a Slot to Edit</h2>
    <p style="font-size:.7rem;color:#667;margin-bottom:8px">Red slots have zero size and cannot be clicked on the rack.</p>
    <div class="slot-grid" id="sp-grid"></div>
    <div style="text-align:right"><button class="sp-close" id="sp-close">Close</button></div>
  </div>
</div>
</div>

/* Snapshot of original GEO values so slots can be reset to defaults */
const DEFAULT_GEO={};
Object.keys(GEO).forEach(k=>{DEFAULT_GEO[k]={x:GEO[k].x,y:GEO[k].y,w:GEO[k].w,h:GEO[k].h};});
const ALL=Object.keys(GEO).map(Number);
const NS='http://www.w3.org/2000/svg';
const MAX_TEXT_LEN=30;   // max characters displayed per label
const MIN_FONT_SIZE=4;   // smallest font-size (px) fitText will shrink to
const FONT_SHRINK_STEP=0.4; // px decrement per fitText iteration
const BADGE_RADIUS=16;   // px radius of cart-slot number badges
const BADGE_PADDING=4;   // px from edge of section to badge centre
const BADGE_GAP=4;       // px gap between adjacent badges
const MIN_BADGE_R=8;     // smallest badge radius when auto-shrinking

/* ---- Persistence -------------------------------------------------- */
const STORAGE_KEY='warehouse-pick-LH';
const RACK_IMAGES={};
/* Settings are stored in IndexedDB (hundreds of MB available) because
   localStorage only holds ~5 MB; pictures used to overflow it, the save
   silently failed, and every reload came back with default settings. */
const IDB_NAME='warehouse-pick-guide', IDB_STORE='settings';
function idbOpen(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB)return rej(new Error('IndexedDB unavailable'));
    const r=indexedDB.open(IDB_NAME,1);
    r.onupgradeneeded=()=>r.result.createObjectStore(IDB_STORE);
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
function idbGet(key){
  return idbOpen().then(db=>new Promise((res,rej)=>{
    const t=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(key);
    t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);
  }));
}
function idbPut(key,val){
  return idbOpen().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(val,key);
    tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);
  }));
}
function applySaved(saved,replaceImages){
  if(!saved)return;
  if(saved.parts){
    Object.entries(saved.parts).forEach(([k,v])=>{
      const n=Number(k);
      if(RACK_PARTS[n]){
        if(v.p!==undefined)RACK_PARTS[n].p=v.p;
        if(v.d!==undefined)RACK_PARTS[n].d=v.d;
      }
    });
  }
  if(saved.geo){
    Object.entries(saved.geo).forEach(([k,v])=>{
      const n=Number(k);
      if(GEO[n]){
        if(v.w!==undefined)GEO[n].w=v.w;
        if(v.h!==undefined)GEO[n].h=v.h;
      }
    });
  }
  if(saved.images){
    if(replaceImages)Object.keys(RACK_IMAGES).forEach(k=>{delete RACK_IMAGES[k];});
    Object.entries(saved.images).forEach(([k,v])=>{RACK_IMAGES[Number(k)]=v;});
  }
}
function collectSettings(){
  const data={parts:{},geo:{},images:{}};
  ALL.forEach(n=>{
    data.parts[n]={p:(RACK_PARTS[n]||{}).p||'',d:(RACK_PARTS[n]||{}).d||''};
    data.geo[n]={w:GEO[n].w,h:GEO[n].h};
    if(RACK_IMAGES[n])data.images[n]=RACK_IMAGES[n];
  });
  return data;
}
async function loadSaved(){
  let saved=null;
  try{saved=await idbGet(STORAGE_KEY);}catch(e){console.warn('IndexedDB load error',e);}
  if(!saved){
    // First run after upgrade: migrate whatever is in localStorage
    try{
      const raw=localStorage.getItem(STORAGE_KEY);
      if(raw){saved=JSON.parse(raw);idbPut(STORAGE_KEY,saved).catch(()=>{});}
    }catch(e){console.warn('load error',e);}
  }
  applySaved(saved,true);
}
function showStatus(msg,isError){
  const fm=document.getElementById('fm');
  if(!fm)return;
  fm.textContent=msg;
  fm.style.color=isError?'#ff6666':'';
}
function saveToStorage(){
  const data=collectSettings();
  idbPut(STORAGE_KEY,data).catch(e=>{
    console.warn('save error',e);
    showStatus('WARNING: settings could not be saved. Use Export to back them up.',true);
  });
  // Small text-only backup (no pictures) so it always fits in localStorage
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify({parts:data.parts,geo:data.geo}));
  }catch(e){/* ignore: IndexedDB copy is the real store */}
}

function mkEl(tag,a){
  const e=document.createElementNS(NS,tag);
  for(const[k,v]of Object.entries(a))e.setAttribute(k,v);
  return e;
}

/** Shrink font-size of an SVG text element until it fits within maxW pixels. */
function fitText(el, maxW) {
  if (typeof el.getComputedTextLength !== 'function') return;
  let sz = parseFloat(el.getAttribute('font-size')) || 10;
  while (sz > MIN_FONT_SIZE && el.getComputedTextLength() > maxW) {
    sz = Math.max(MIN_FONT_SIZE, sz - FONT_SHRINK_STEP);
    el.setAttribute('font-size', sz.toFixed(1));
  }
}

/** Dynamically create all rack cell rects and text elements from GEO. */
function generateRackCells(){
  const container=document.getElementById('rack-cells');
  const NARROW_W=90;
  const LABEL_X=5;
  const LABEL_Y=16;
  const MIN_TEXT_GAP = 10;
  const BOTTOM_PAD   = 6;
  const frag = document.createDocumentFragment();
  ALL.forEach(n => {
    const g = GEO[n];
    const narrow = g.w < NARROW_W;
    const fs  = narrow ? 12 : 15;
    const pfs = narrow ? 10 : 13;
    const dfs = narrow ? 12 : 16;
    const descY = Math.min(g.y + g.h * 0.89, g.y + g.h - BOTTOM_PAD);
    const partY = Math.min(g.y + g.h * 0.75, descY - MIN_TEXT_GAP);
    // Cell rect
    frag.appendChild(mkEl('rect', {id:'s'+n, class:'RS', x:g.x, y:g.y, width:g.w, height:g.h}));
    // Image element (populated by renderRackImages)
    frag.appendChild(mkEl('image', {id:'img'+n, x:g.x+1, y:g.y+1,
      width:Math.max(0,g.w-2), height:Math.max(0,g.h-2),
      preserveAspectRatio:'xMidYMid meet', 'pointer-events':'none'}));
    // Section number label (top-left)
    const lbl = mkEl('text', {id:'l'+n, class:'SN', x:g.x+LABEL_X, y:g.y+LABEL_Y, 'font-size':fs});
    lbl.textContent = n;
    frag.appendChild(lbl);
    // Part number text (bottom area)
    frag.appendChild(mkEl('text', {id:'p'+n, class:'SP', x:g.x+g.w/2, y:partY, 'font-size':pfs}));
    // Description text (bottom area, below part)
    frag.appendChild(mkEl('text', {id:'d'+n, class:'SD', x:g.x+g.w/2, y:descY, 'font-size':dfs}));
  });
  container.appendChild(frag);
}

/** Populate part-number and description text into every rack section. */
function renderRackLabels(){
  ALL.forEach(n=>{
    const g=GEO[n];
    const rp=RACK_PARTS[n]||{p:'',d:''};
    const pel=document.getElementById('p'+n);
    const del_=document.getElementById('d'+n);
    if(pel){
      pel.textContent=String(rp.p).slice(0,MAX_TEXT_LEN);
      fitText(pel,g.w-8);
    }
    if(del_){
      del_.textContent=String(rp.d).slice(0,MAX_TEXT_LEN);
      fitText(del_,g.w-8);
    }
  });
}

/** Section -> [cart slots] map built from PICK_ROUTES. */
function sectionMap(){
  const map={};
  for(const[slot,racks]of Object.entries(PICK_ROUTES)){
    (racks||[]).forEach(rn=>{
      const k=Number(rn);
      if(!map[k])map[k]=[];
      if(!map[k].includes(Number(slot)))map[k].push(Number(slot));
    });
  }
  Object.values(map).forEach(a=>a.sort((x,y)=>x-y));
  return map;
}
function hEl(tag,cls,text){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(text!==undefined)e.textContent=text;
  return e;
}
/** Draw the 8 orange cart slots, laid out like the real cart:
    top row 8 6 4 2, bottom row 7 5 3 1. */
function renderCartLabels(){
  const SLOT_POS={1:{col:3,row:1},2:{col:3,row:0},3:{col:2,row:1},4:{col:2,row:0},5:{col:1,row:1},6:{col:1,row:0},7:{col:0,row:1},8:{col:0,row:0}};
  const frame=document.getElementById('cart-frame');
  if(!frame)return;
  frame.innerHTML='';
  for(let s=1;s<=8;s++){
    const op=ORANGE_PARTS[s]||{p:'',d:''};
    const secs=[...new Set((PICK_ROUTES[s]||[]).map(Number))].sort((a,b)=>a-b);
    const card=hEl('div','slot'+(secs.length?' on':'')+(!op.p&&!op.d&&!secs.length?' empty':''));
    card.style.gridColumn=SLOT_POS[s].col+1;
    card.style.gridRow=SLOT_POS[s].row+1;
    card.appendChild(hEl('div','sn',s));
    card.appendChild(hEl('div','dt',String(op.p||'').slice(0,MAX_TEXT_LEN)));
    card.appendChild(hEl('div','dc',String(op.d||'').slice(0,MAX_TEXT_LEN)));
    const pf=hEl('div','pf');
    pf.appendChild(hEl('div','lbl',secs.length?'PICK FROM':'NOTHING TO PICK'));
    const chips=hEl('div','chips');
    secs.forEach(n=>chips.appendChild(hEl('span','chip',n)));
    pf.appendChild(chips);
    card.appendChild(pf);
    frame.appendChild(card);
  }
}
/** One row per highlighted rack section: part -> cart slots. */
function renderPickList(map){
  const list=document.getElementById('picklist');
  if(!list)return;
  list.innerHTML='';
  const secs=Object.keys(map).map(Number).sort((a,b)=>a-b);
  if(!secs.length){list.appendChild(hEl('div','pl-empty','No picks for these doors.'));return;}
  secs.forEach(n=>{
    const rp=RACK_PARTS[n]||{p:'',d:''};
    const row=hEl('div','pl');
    row.appendChild(hEl('div','sec',n));
    const pt=hEl('div','pt');
    pt.appendChild(hEl('b','',rp.d||rp.p||('Section '+n)));
    pt.appendChild(hEl('span','',rp.d?rp.p:''));
    row.appendChild(pt);
    const to=hEl('div','to');
    to.appendChild(hEl('span','ar','➜'));
    map[n].forEach(c=>to.appendChild(hEl('span','dot',c)));
    row.appendChild(to);
    list.appendChild(row);
  });
}

/** Draw orange cart-slot number badges on an illuminated rack section. */
function drawBadges(slotNum,cartNums){
  const g=GEO[slotNum];if(!g||g.w<=0||g.h<=0)return;  // hidden section: badges would sit on a neighbour
  const layer=document.getElementById('badge-layer');
  const sorted=[...cartNums].sort((a,b)=>a-b);
  const count=sorted.length;if(!count)return;
  // Compute badge radius: start at standard, shrink if needed to fit all badges
  let R=BADGE_RADIUS,GAP=BADGE_GAP,PAD=BADGE_PADDING;
  for(let i=0;i<20&&R>MIN_BADGE_R;i++){
    const step=R*2+GAP;
    const pR=Math.max(1,Math.floor((g.w-PAD*2+GAP)/step));
    const rows=Math.ceil(count/pR);
    if(PAD*2+rows*R*2+(rows-1)*GAP<=g.h) break;
    R-=0.5;GAP=BADGE_GAP*(R/BADGE_RADIUS);PAD=BADGE_PADDING*(R/BADGE_RADIUS);
  }
  const STEP=R*2+GAP;
  const usableW=g.w-PAD*2;
  const perRow=Math.max(1,Math.floor((usableW+GAP)/STEP));
  sorted.forEach((num,i)=>{
    const col=i%perRow;
    const row=Math.floor(i/perRow);
    const rowStart=row*perRow;
    const inThisRow=Math.min(perRow,count-rowStart);
    const rowWidth=inThisRow*R*2+(inThisRow-1)*GAP;
    const rowStartX=g.x+(g.w-rowWidth)/2+R;
    const cx=rowStartX+col*STEP;
    const cy=g.y+PAD+R+row*STEP;
    if(cy+R>g.y+g.h)return;
    const grp=document.createElementNS(NS,'g');
    const sw=Math.max(0.8,1.5*(R/BADGE_RADIUS));
    const circle=mkEl('circle',{fill:'#FF6A13',stroke:'#111','stroke-width':sw.toFixed(1),cx,cy,r:R});
    const fs=Math.max(5,Math.round(17*(R/BADGE_RADIUS)));
    const text=mkEl('text',{'font-family':'Arial,sans-serif','font-size':fs,'font-weight':'900',fill:'#fff','text-anchor':'middle','dominant-baseline':'central','pointer-events':'none',x:cx,y:cy});
    text.textContent=num;grp.appendChild(circle);grp.appendChild(text);layer.appendChild(grp);
  });
}

/** Apply active highlights and badges from PICK_ROUTES. */
function applyPickRoutes(){
  // Clear all active states
  ALL.forEach(n=>{
    ['s','l','p','d'].forEach(pfx=>{
      const el=document.getElementById(pfx+n);
      if(el)el.classList.remove('on');
    });
  });
  const bl=document.getElementById('badge-layer');
  if(bl)bl.innerHTML='';

  const map=sectionMap();

  Object.entries(map).forEach(([rn,slots])=>{
    const n=Number(rn);
    ['s','l','p','d'].forEach(pfx=>{
      const el=document.getElementById(pfx+n);
      if(el)el.classList.add('on');
    });
    drawBadges(n,slots);
  });

  renderCartLabels();
  renderPickList(map);
  const doors=Object.keys(PICK_ROUTES).filter(s=>(PICK_ROUTES[s]||[]).length>0).length;
  const nSec=Object.keys(map).length;
  showStatus(nSec?'Pick each highlighted part and place it in the numbered orange cart slot':'No active picks configured',false);
  document.getElementById('fx').textContent=doors+' doors \u00b7 '+nSec+' rack sections';
}

/** Populate rack slot images from RACK_IMAGES. */
function renderRackImages(){
  ALL.forEach(n=>{
    const imgEl=document.getElementById('img'+n);
    if(!imgEl)return;
    const src=RACK_IMAGES[n]||'';
    if(src){
      imgEl.setAttribute('href',src);

  });

/* ---- Edit modal --------------------------------------------------- */
let currentEditSlot=null;
let modalMouseDownOnBackdrop=false;

function openEditModal(n){
  currentEditSlot=n;
  const g=GEO[n];
  const rp=RACK_PARTS[n]||{p:'',d:''};
  document.getElementById('em-slot').textContent=n;
  document.getElementById('em-part').value=rp.p||'';
  document.getElementById('em-desc').value=rp.d||'';
  document.getElementById('em-w').value=g.w;
  document.getElementById('em-h').value=g.h;
  const preview=document.getElementById('em-preview');
  const rmBtn=document.getElementById('em-rm-img');
  if(RACK_IMAGES[n]){preview.src=RACK_IMAGES[n];preview.style.display='block';rmBtn.style.display='inline-block';}
  else{preview.style.display='none';rmBtn.style.display='none';}
  document.getElementById('em-img').value='';
  document.getElementById('edit-modal').style.display='flex';
}

function closeEditModal(){
  document.getElementById('edit-modal').style.display='none';
  currentEditSlot=null;
}

function saveEditModal(){
  if(currentEditSlot===null)return;
  const n=currentEditSlot;
  if(!RACK_PARTS[n])RACK_PARTS[n]={p:'',d:''};
  RACK_PARTS[n].p=document.getElementById('em-part').value.slice(0,MAX_TEXT_LEN);
  RACK_PARTS[n].d=document.getElementById('em-desc').value.slice(0,MAX_TEXT_LEN);
  GEO[n].w=Math.max(0,parseInt(document.getElementById('em-w').value)||0);
  GEO[n].h=Math.max(0,parseInt(document.getElementById('em-h').value)||0);
  saveToStorage();
  fullRerender();
  closeEditModal();
}

function resetSlotToDefault(){
  if(currentEditSlot===null)return;
  const n=currentEditSlot;
  const def=DEFAULT_GEO[n];
  if(def){
    document.getElementById('em-w').value=def.w;
    document.getElementById('em-h').value=def.h;
  }
}

function handleImageUpload(e){
  const file=e.target.files&&e.target.files[0];
  if(!file||currentEditSlot===null)return;
  const reader=new FileReader();
  reader.onload=function(evt){
    RACK_IMAGES[currentEditSlot]=evt.target.result;
    const preview=document.getElementById('em-preview');
    preview.src=evt.target.result;
    preview.style.display='block';
    document.getElementById('em-rm-img').style.display='inline-block';
  };
  reader.readAsDataURL(file);
}

function removeImage(){
  if(currentEditSlot===null)return;
  delete RACK_IMAGES[currentEditSlot];
  document.getElementById('em-preview').style.display='none';
  document.getElementById('em-rm-img').style.display='none';

/* ---- Export / Import ----------------------------------------------- */
function exportSettings(){
  const data=collectSettings();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=STORAGE_KEY+'-settings.json';
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
}

function importSettings(e){
  const file=e.target.files&&e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(evt){
    try{
      const saved=JSON.parse(evt.target.result);
      applySaved(saved,true);
      saveToStorage();
      fullRerender();
    }catch(err){console.warn('import error',err);alert('Invalid settings file.');}
  };
  reader.readAsText(file);
  e.target.value='';
}

/* ---- Live data (next 8 doors) ------------------------------------- */
let lastLiveSig='';
function applyLiveData(data){
  if(!data||typeof data!=='object')return false;
  const orange=data.orange||data.ORANGE_PARTS;
  const routes=data.routes||data.PICK_ROUTES;
  if(!orange&&!routes)return false;
  const sig=JSON.stringify([orange||null,routes||null]);
  if(sig===lastLiveSig)return false;   // nothing changed: touch nothing
  lastLiveSig=sig;
  if(orange){
    Object.keys(ORANGE_PARTS).forEach(k=>{delete ORANGE_PARTS[k];});
    Object.entries(orange).forEach(([k,v])=>{
      ORANGE_PARTS[Number(k)]={p:String((v&&v.p)||''),d:String((v&&v.d)||'')};
    });
  }
  if(routes){
    Object.keys(PICK_ROUTES).forEach(k=>{delete PICK_ROUTES[k];});
    Object.entries(routes).forEach(([k,v])=>{
      PICK_ROUTES[Number(k)]=(Array.isArray(v)?v:String(v||'').split(','))
        .map(Number).filter(x=>x>0);
    });
  }
  // Only redraw the cart labels and highlights; rack cells, edits,
  // sizes, pictures and any open edit window stay exactly as they are.
  renderCartLabels();
  applyPickRoutes();
  document.getElementById('lu').textContent=new Date().toLocaleTimeString();
  return true;
}
window.updatePickData=applyLiveData;
/* Re-read this same HTML file in a hidden frame (works when opened as a
   local file or from a server) and apply its doors/routes if changed. */
function startLivePolling(){
  if(!(CHECK_FOR_UPDATES_SECONDS>0))return;
  const sd=document.getElementById('sd');
  let frame=null,timer=null;
  function done(ok){
    if(timer){clearTimeout(timer);timer=null;}
    if(frame){frame.remove();frame=null;}
    if(sd)sd.style.background=ok?'':'#ff4444';  // red dot = file could not be read
  }
  window.addEventListener('message',e=>{
    if(!frame||e.source!==frame.contentWindow)return;
    const d=e.data;
    if(d&&d.type==='pick-guide-data'){applyLiveData(d);done(true);}
  });
  function check(){
    if(frame)return;  // previous check still running
    frame=document.createElement('iframe');
    frame.style.cssText='position:absolute;width:0;height:0;border:0;visibility:hidden';
    frame.setAttribute('aria-hidden','true');
    frame.src=location.pathname.split('/').pop()+'?probe='+Date.now();
    timer=setTimeout(()=>done(false),15000);
    document.body.appendChild(frame);
  }
  setInterval(check,CHECK_FOR_UPDATES_SECONDS*1000);
}

function fullRerender(){
  document.getElementById('rack-cells').innerHTML='';
  document.getElementById('badge-layer').innerHTML='';
  generateRackCells();
  renderRackLabels();
  renderRackImages();
  applyPickRoutes();
  setupClickHandlers();
}
